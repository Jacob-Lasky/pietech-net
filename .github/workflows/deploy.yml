name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time per branch; later pushes supersede earlier in-flight runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Run worker tests
        run: node --test _worker.test.js

      - name: Build dist
        run: |
          mkdir -p dist
          cp index.html _worker.js dist/

      - name: Ensure www custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/pietech-net/domains`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          async function api(method, body) {
            const response = await fetch(endpoint, { method, headers, body: body && JSON.stringify(body) });
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(`Pages domain ${method} failed: HTTP ${response.status}, ${JSON.stringify(data.errors)}`);
            return data.result;
          }
          const domains = await api('GET');
          const domain = domains.find(d => d.name === 'www.pietech.net') || await api('POST', { name: 'www.pietech.net' });
          console.log(`www.pietech.net: ${domain.status}`);
          JS

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name pietech-net --branch main
